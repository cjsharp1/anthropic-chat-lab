<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    GitHub Pages front page.

    Pages serves this repository's root, so this file is what answers
    https://cjsharp1.github.io/anthropic-chat-lab/ — the URL people reach
    for when they trim the path or follow the link in the repo sidebar.

    It redirects to overview.html rather than duplicating it. A copy would
    be two 25K files to keep in step, and they would drift the first time
    one of them was edited. The redirect keeps overview.html as the single
    source of truth while the short URL still works.

    Belt and braces, because each covers a case the others miss:
      - the refresh meta works with no JavaScript
      - canonical tells search engines which URL is the real one
      - the visible link is what a reader sees if both are blocked
  -->
  <meta http-equiv="refresh" content="0; url=overview.html">
  <link rel="canonical" href="overview.html">

  <title>Anthropic Chat Lab</title>

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 34rem;
      margin: 18vh auto 0;
      padding: 0 1.5rem;
      line-height: 1.6;
      color: #1d1b19;
      background: #f7f6f4;
    }
    a { color: #9a4f20; }

    @media (prefers-color-scheme: dark) {
      body { color: #eae7e1; background: #161513; }
      a { color: #d98a55; }
    }
  </style>
</head>
<body>
  <p>Redirecting to the <a href="overview.html">project overview</a>…</p>
</body>
</html>
